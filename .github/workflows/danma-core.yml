name: DANMA CPU and TCP MVP

on:
  push:
    branches: [main, feat/danma-tcp-gossip-3node]
    paths: [danma-core/**, danma-net/**, Cargo.toml, Cargo.lock, .github/workflows/danma-core.yml]
  pull_request:
    paths: [danma-core/**, Cargo.toml, .github/workflows/danma-core.yml]

permissions:
  contents: read

jobs:
  cpu-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone CPU core
        run: cargo test --locked -p danma-core --all-targets
      - name: Test three-process TCP network
        run: cargo test --locked -p danma-net --all-targets
