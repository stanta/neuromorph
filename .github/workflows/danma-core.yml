name: DANMA CPU shards and TCP MVP

on:
  push:
    branches: [main]
    paths: [danma-core/**, danma-net/**, danma-shard/**, Cargo.toml, Cargo.lock, .github/workflows/danma-core.yml]
  pull_request:
    paths: [danma-core/**, danma-net/**, danma-shard/**, Cargo.toml, Cargo.lock, .github/workflows/danma-core.yml]

permissions:
  contents: read

jobs:
  cpu-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone CPU core
        run: cargo test --locked -p danma-core --all-targets
      - name: Test multi-neuron CPU shard
        run: cargo test --locked -p danma-shard --all-targets
      - name: Test three-process TCP network
        run: cargo test --locked -p danma-net --all-targets
      - name: Lint targeted Rust crates
        run: cargo clippy --locked -p danma-core -p danma-shard -p danma-net --all-targets -- -D warnings
